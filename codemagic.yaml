
workflows:
  carbrowser-ios:
    name: CarBrowser iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Check Xcode
        script: xcodebuild -version

      - name: Build CarBrowser
        script: |
          xcodebuild \
            -project CarBrowser.xcodeproj \
            -scheme CarBrowser \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build
